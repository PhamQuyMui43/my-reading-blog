---
layout: default
---

<article class="reading-article">
  <header class="article-header">
    <h1 class="article-title">{{ page.title }}</h1>
    <div class="article-meta">
      <time>{{ page.date | date: "%d/%m/%Y" }}</time>
      {% if page.author %} &middot; <span>Tác giả: {{ page.author }}</span>{% endif %}
      {% if page.translator %} &middot; <span>Người dịch: {{ page.translator }}</span>{% endif %}
    </div>
  </header>

  <div class="article-content">
    {{ content }}
  </div>

  <footer class="article-footer">
    <hr>
    <p><a href="{{ '/' | relative_url }}">&larr; Quay lại Mục lục</a></p>
  </footer>

  <section class="comments-area">
    <h3>Bình luận & Chia sẻ</h3>
    <script src="https://utteranc.es/client.js"
            repo="PhamQuyMui43/my-reading-blog"
            issue-term="pathname"
            theme="github-light"
            crossorigin="anonymous"
            async>
    </script>
  </section>
</article>

<style>
  .article-header {
    margin-bottom: 30px;
    border-bottom: 1px solid rgba(0, 0, 0, 0.08);
    padding-bottom: 15px;
  }
  .article-title {
    font-size: 2rem;
    line-height: 1.3;
    margin: 0 0 10px 0;
  }
  .article-meta {
    font-size: 0.9rem;
    color: #666;
    font-style: italic;
  }
  .article-content {
    line-height: 1.9;
  }
  .article-footer {
    margin-top: 50px;
  }
  .article-footer hr {
    border: none;
    border-top: 1px dashed #ccc;
    margin-bottom: 20px;
  }
  .comments-area {
    margin-top: 40px;
    padding-top: 20px;
  }
</style>
