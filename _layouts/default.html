<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ page.title | default: site.title }}</title>

  <!-- Google Fonts: Nhúng sẵn Roboto Slab, Lora, EB Garamond, Playfair Display, Merriweather -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400..700;1,400..700&family=Lora:ital,wght@0,400..700;1,400..700&family=Merriweather:ital,wght@0,300;0,400;0,700;1,300&family=Playfair+Display:ital,wght@0,400..800;1,400..800&family=Roboto+Slab:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    /* Thiết lập cơ bản toàn trang */
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: 'Roboto Slab', Georgia, serif;
      background-color: #f7f5f0;
      color: #2b2b2b;
      line-height: 1.8;
    }
    .site-wrapper {
      max-width: 780px;
      margin: 0 auto;
      padding: 40px 20px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .site-nav {
      margin-bottom: 30px;
      padding-bottom: 15px;
      border-bottom: 1px solid #e0dbd1;
    }
    .site-nav a {
      color: #7a6e65;
      text-decoration: none;
      font-size: 0.95rem;
      font-weight: 500;
    }
    .site-nav a:hover {
      color: #b35434;
    }
    .main-content {
      flex: 1;
    }
    .site-footer {
      margin-top: 50px;
      padding-top: 20px;
      border-top: 1px solid #e0dbd1;
      text-align: center;
      font-size: 0.85rem;
      color: #8c827a;
    }
  </style>
</head>
<body style="{% if page.bg_color %}background-color: {{ page.bg_color }};{% endif %}">
  <div class="site-wrapper">
    <nav class="site-nav">
      <a href="{{ '/' | relative_url }}">&larr; Về Mục Lục</a>
    </nav>

    <main class="main-content">
      {{ content }}
    </main>

    <footer class="site-footer">
      <p>&copy; {{ site.time | date: "%Y" }} Phủi Bụi Lãng Quên &middot; Tủ sách văn chương hoài niệm</p>
    </footer>
  </div>
</body>
</html>
